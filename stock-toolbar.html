<!-- =========================================================
     CUSTOM STOCK LEVEL + SEARCH
     Add inside the "Current Stock" section, replacing its
     section-header contents if desired.
========================================================= -->

<div class="stock-toolbar">

  <div class="stock-title-wrap">
    <div>
      <p class="stock-eyebrow">Inventory Control</p>
      <h2>Current Stock</h2>
    </div>
  </div>

  <div class="stock-search-wrap">
    <span class="stock-search-icon">⌕</span>
    <input
      id="stockSearch"
      type="search"
      placeholder="Search product..."
      autocomplete="off"
      aria-label="Search current stock"
    >
    <button
      type="button"
      id="clearStockSearch"
      class="stock-search-clear hidden"
      aria-label="Clear search"
      title="Clear search"
    >×</button>
  </div>

</div>
