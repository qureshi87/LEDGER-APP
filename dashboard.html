<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Stock Ledger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="dashboard">
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Inventory dashboard</p>
          <h1>Stock Ledger</h1>
        </div>
        <nav class="main-nav" aria-label="Main menu">
          <a class="nav-link active" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="received.html">Received</a>
          <a class="nav-link" href="issued.html">Issued</a>
          <a class="nav-link" href="history.html">History</a>
        </nav>
      </header>

      <main>
        <section class="stats-grid" aria-label="Inventory summary">
          <article class="stat-card">
            <span>Inventory value</span>
            <strong id="inventoryValue">$0.00</strong>
          </article>
          <article class="stat-card">
            <span>Items in stock</span>
            <strong id="itemsInStock">0</strong>
          </article>
          <article class="stat-card">
            <span>Received value</span>
            <strong id="receivedValue">$0.00</strong>
          </article>
          <article class="stat-card">
            <span>Issued value</span>
            <strong id="issuedValue">$0.00</strong>
          </article>
        </section>

        <section class="panel">
          <div class="section-header">
            <h2>Add stock movement</h2>
          </div>

          <form id="dashboardForm">
            <div class="field-row">
              <label>
                Product name
                <input id="product" type="text" placeholder="e.g. Tag, Box, Paper" required />
              </label>

              <label>
                Transaction type
                <select id="movementType">
                  <option value="received">Received from vendor</option>
                  <option value="issued">Issued to person</option>
                  <option value="adjustment">Adjustment</option>
                </select>
              </label>

              <label id="counterpartyLabel">
                Vendor name
                <input id="counterparty" type="text" placeholder="e.g. ABC Supplies" />
              </label>

              <label id="adjustmentWrap" class="hidden">
                Adjustment
                <select id="adjustmentDirection">
                  <option value="increase">Increase stock</option>
                  <option value="decrease">Decrease stock</option>
                </select>
              </label>
            </div>

            <div class="field-row">
              <label>
                Quantity
                <input id="quantity" type="number" min="1" step="1" value="1" required />
              </label>

              <label>
                Unit price
                <input id="unitPrice" type="number" min="0" step="0.01" value="0" />
              </label>

              <label>
                Date
                <input id="date" type="date" required />
              </label>
            </div>

            <label>
              Notes
              <textarea id="note" rows="3" placeholder="Optional notes about this transaction"></textarea>
            </label>

            <div class="form-actions">
              <button type="submit" class="primary">Save transaction</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="section-header">
            <h2>Dashboard - current stock live status</h2>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Qty in stock</th>
                  <th>Avg cost</th>
                  <th>Stock value</th>
                </tr>
              </thead>
              <tbody id="stockTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
