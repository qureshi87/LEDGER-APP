<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stock Ledger - Received</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <div class="app-shell">

    <header class="topbar">
      <div>
        <p class="eyebrow">Inventory Management</p>
        <h1>Received Stock</h1>
        <p class="subtitle">
          Stock received from vendors
        </p>
      </div>
    </header>

    <nav class="main-nav">

      <a href="./index.html">
        Dashboard
      </a>

      <a href="./received.html" class="active">
        Received
      </a>

      <a href="./issued.html">
        Issued
      </a>

      <a href="./history.html">
        History
      </a>

    </nav>

    <main>

      <section class="panel">

        <div class="section-header">
          <h2>Received Stock</h2>
        </div>

        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th>Date</th>
                <th>Product</th>
                <th>Vendor</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total</th>
              </tr>

            </thead>

            <tbody id="receivedTableBody">

              <tr>
                <td colspan="6">
                  No received stock yet.
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </main>

  </div>

  <script src="./app.js"></script>

</body>
</html>
