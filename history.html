<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stock Ledger - History</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >

</head>


<body>

  <div class="app-shell">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="topbar">

      <div>

        <p class="eyebrow">
          Inventory Management
        </p>

        <h1>
          Transaction History
        </h1>

        <p class="subtitle">
          Complete stock movement history
        </p>

      </div>

    </header>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav class="main-nav">

      <a href="./index.html">
        Dashboard
      </a>

      <a href="./received.html">
        Received
      </a>

      <a href="./issued.html">
        Issued
      </a>

      <a
        href="./history.html"
        class="active"
      >
        History
      </a>

    </nav>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main>


      <section class="panel">


        <div class="section-header">

          <h2>
            All Transactions
          </h2>

        </div>


        <div class="table-wrap">


          <table>


            <thead>

              <tr>

                <th>
                  Date
                </th>

                <th>
                  Product
                </th>

                <th>
                  Type
                </th>

                <th>
                  Counterparty
                </th>

                <th>
                  Quantity
                </th>

                <th>
                  Unit Price
                </th>

                <th>
                  Total
                </th>

                <th>
                  Notes
                </th>

              </tr>

            </thead>


            <tbody id="historyTableBody">

              <tr>

                <td colspan="8">
                  No transactions yet.
                </td>

              </tr>

            </tbody>


          </table>


        </div>


      </section>


    </main>


  </div>


  <!-- =================================================
       APPLICATION
  ================================================== -->

  <script src="./app.js"></script>


</body>

</html>
